[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structforge"
version = "0.1.0"
description = "PE32+/ELF64 RTTI & VTable harvester, differential heap-dump struct recoverer, and layout-verified C++20 SDK compiler"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[project.scripts]
structforge = "structforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
